# =============================================================================
# AgentCTL Fleet Machine Inventory
# =============================================================================
#
# This file defines ALL machines in the AgentCTL fleet, spanning two distinct
# deployment topologies:
#
#   1. Docker topology — deployed via .github/workflows/deploy-fleet.yml
#      using GHCR container images pulled onto remote machines.
#      Consumed by: deploy-fleet.yml, fleet-bootstrap.ts, machine-inventory.ts.
#
#   2. PM2 mesh topology — deployed via scripts/peer-update.ts which runs
#      `git checkout <tag> && pnpm build && pm2 reload` directly on each
#      node.  These machines run infra/pm2/ecosystem.mesh.config.cjs and
#      are bootstrapped by scripts/setup-mesh-node.sh.
#
# The two topologies use different deploy paths and MUST NOT overlap.
# Docker machines pull container images; PM2 machines build from source.
#
# Tailscale IPs use the CGNAT range 100.64.0.0/10 (100.64.0.0 – 100.127.255.255).
# Replace placeholder IPs below with actual Tailscale-assigned addresses.
#
# To find your Tailscale IP:  tailscale ip -4
# To find your MagicDNS name: tailscale status
#
# After editing, validate with:
#   npx tsx scripts/fleet-bootstrap.ts --dry-run
# =============================================================================

defaults:
  docker_compose_file: docker-compose.prod.yml
  deploy_user: deploy
  health_check_path: /health
  health_check_timeout: 30

# =============================================================================
# Docker Topology
# =============================================================================
#
# These machines run agentctl via Docker Compose with GHCR images.
# Deployed by: .github/workflows/deploy-fleet.yml
# Bootstrap:   scripts/fleet-bootstrap.ts (copies setup-machine.sh via SSH)
#
# Placeholder entries below — replace IPs and hostnames when provisioning
# Docker-based fleet members (e.g. EC2 instances, dedicated VMs).

machines:
  - id: control-plane-1
    role: control-plane
    tailscale_ip: 100.64.0.1          # placeholder — replace with real IP
    hostname: cp-primary
    services: [control-plane]
    deploy_order: 1
    labels:
      topology: docker
    capabilities:
      gpu: false
      max_agents: 0

  - id: worker-ec2-1
    role: agent-worker
    tailscale_ip: 100.64.0.2          # placeholder — replace with real IP
    hostname: ec2-us-east
    services: [agent-worker]
    deploy_order: 2
    labels:
      topology: docker
    capabilities:
      gpu: false
      max_agents: 4

# =============================================================================
# PM2 Mesh Topology
# =============================================================================
#
# These machines run agentctl natively via PM2 (no Docker).
# Each node runs both control-plane and agent-worker (full mesh peer).
#
# Deployed by:   scripts/peer-update.ts (git checkout + pnpm build + pm2 reload)
# Bootstrap:     scripts/setup-mesh-node.sh (generates .env.mesh, creates DB)
# PM2 config:    infra/pm2/ecosystem.mesh.config.cjs
# Auto-update:   infra/systemd/agentctl-peer-update.* (Linux)
#                infra/launchd/com.agentctl.peer-update.plist (macOS)
#
# MagicDNS hostnames (e.g. "pinnacle-macmini") are stable across IP changes.
# The tailscale_ip field is required for fleet-bootstrap.ts validation but
# may drift if Tailscale reassigns addresses. Run `tailscale ip -4` on each
# node to refresh.
#
# Ports (from .env.mesh / ecosystem.mesh.config.cjs):
#   Control Plane: 8080  |  Agent Worker: 9000
#
# Peer registration: nodes auto-discover each other via SYNC_PEER_REGISTRATION_TOKEN
# (must match across all mesh peers — see setup-mesh-node.sh).

  - id: mesh-laptop
    role: agent-worker
    tailscale_ip: 100.64.0.10         # placeholder — run `tailscale ip -4` to fill
    hostname: laptop                   # MagicDNS: check `tailscale status` for exact name
    services: [control-plane, agent-worker]
    deploy_order: 1
    labels:
      topology: pm2-mesh
      owner: primary-dev
    capabilities:
      gpu: true
      max_agents: 2

  - id: mesh-macmini
    role: agent-worker
    tailscale_ip: 100.64.0.11         # placeholder — run `tailscale ip -4` to fill
    hostname: pinnacle-macmini         # MagicDNS hostname
    services: [control-plane, agent-worker]
    deploy_order: 2
    labels:
      topology: pm2-mesh
    capabilities:
      gpu: true
      max_agents: 4
