name: Memory Evals

on:
  schedule:
    # Weekly Monday 06:00 UTC — run the held-out split once private fixture +
    # eval env secrets are configured.
    - cron: '0 6 * * 1'
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      split:
        description: 'Eval split to run'
        required: true
        default: held-out
        type: choice
        options:
          - held-out
          - full

permissions:
  contents: read
  actions: read

concurrency:
  group: memory-evals-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: '8.15.4'
  PRIMARY_NODE: '22'
  PRIVATE_FIXTURE_PATH: tmp/memory-eval/agentctl-private.json
  PRIVATE_FIXTURE_CHANGELOG_PATH: tmp/memory-eval/fixtures/CHANGELOG.md

jobs:
  memory-eval:
    name: Memory Eval
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve mode, validate secrets, and stage private fixture
        id: prep
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SPLIT: ${{ inputs.split }}
          MEMORY_EVAL_DATABASE_URL: ${{ secrets.MEMORY_EVAL_DATABASE_URL }}
          MEMORY_EVAL_EMBEDDING_API_URL: ${{ secrets.MEMORY_EVAL_EMBEDDING_API_URL }}
          MEMORY_EVAL_LITELLM_PROXY_URL: ${{ secrets.MEMORY_EVAL_LITELLM_PROXY_URL }}
          MEMORY_EVAL_LITELLM_URL: ${{ secrets.MEMORY_EVAL_LITELLM_URL }}
          MEMORY_EVAL_PRIVATE_FIXTURE_JSON_B64: ${{ secrets.MEMORY_EVAL_PRIVATE_FIXTURE_JSON_B64 }}
          MEMORY_EVAL_PRIVATE_FIXTURE_CHANGELOG_B64: ${{ secrets.MEMORY_EVAL_PRIVATE_FIXTURE_CHANGELOG_B64 }}
          MEMORY_EVAL_RELEASE_REQUIRED: ${{ vars.MEMORY_EVAL_RELEASE_REQUIRED }}
        run: |
          set -euo pipefail

          split=""
          strict="false"
          case "$EVENT_NAME" in
            schedule)
              split="held-out"
              ;;
            push)
              split="full"
              if [ "${MEMORY_EVAL_RELEASE_REQUIRED:-false}" = "true" ]; then
                strict="true"
              fi
              ;;
            workflow_dispatch)
              split="${INPUT_SPLIT:-held-out}"
              strict="true"
              ;;
            *)
              echo "::error title=Unsupported trigger::Unexpected event $EVENT_NAME"
              exit 1
              ;;
          esac

          echo "split=$split" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"

          missing=()
          if [ -z "${MEMORY_EVAL_DATABASE_URL:-}" ]; then
            missing+=("MEMORY_EVAL_DATABASE_URL")
          fi
          if [ -z "${MEMORY_EVAL_PRIVATE_FIXTURE_JSON_B64:-}" ]; then
            missing+=("MEMORY_EVAL_PRIVATE_FIXTURE_JSON_B64")
          fi
          if [ -z "${MEMORY_EVAL_PRIVATE_FIXTURE_CHANGELOG_B64:-}" ]; then
            missing+=("MEMORY_EVAL_PRIVATE_FIXTURE_CHANGELOG_B64")
          fi
          if [ -z "${MEMORY_EVAL_EMBEDDING_API_URL:-}" ] \
            && [ -z "${MEMORY_EVAL_LITELLM_PROXY_URL:-}" ] \
            && [ -z "${MEMORY_EVAL_LITELLM_URL:-}" ]; then
            missing+=("one of MEMORY_EVAL_EMBEDDING_API_URL | MEMORY_EVAL_LITELLM_PROXY_URL | MEMORY_EVAL_LITELLM_URL")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## Memory eval workflow not configured"
              echo
              echo "Split: \`$split\`"
              echo
              if [ "$EVENT_NAME" = "push" ]; then
                echo "Release tag enforcement: \`${MEMORY_EVAL_RELEASE_REQUIRED:-false}\`"
                echo
                if [ "${MEMORY_EVAL_RELEASE_REQUIRED:-false}" != "true" ]; then
                  echo "Set repository variable \`MEMORY_EVAL_RELEASE_REQUIRED=true\` after the private fixture and eval secrets are provisioned to make release-tag eval configuration blocking."
                  echo
                fi
              fi
              echo "Missing configuration:"
              for item in "${missing[@]}"; do
                echo "- \`$item\`"
              done
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$strict" = "true" ]; then
              echo "::error title=Missing memory eval configuration::${missing[*]}"
              exit 1
            fi

            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p "$(dirname "$PRIVATE_FIXTURE_PATH")" "$(dirname "$PRIVATE_FIXTURE_CHANGELOG_PATH")"
          printf '%s' "$MEMORY_EVAL_PRIVATE_FIXTURE_JSON_B64" | base64 --decode > "$PRIVATE_FIXTURE_PATH"
          printf '%s' "$MEMORY_EVAL_PRIVATE_FIXTURE_CHANGELOG_B64" | base64 --decode > "$PRIVATE_FIXTURE_CHANGELOG_PATH"

      - name: Set up pnpm
        if: steps.prep.outputs.should_run == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        if: steps.prep.outputs.should_run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.PRIMARY_NODE }}
          cache: pnpm

      - name: Install dependencies
        if: steps.prep.outputs.should_run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run live memory eval
        if: steps.prep.outputs.should_run == 'true'
        env:
          DATABASE_URL: ${{ secrets.MEMORY_EVAL_DATABASE_URL }}
          EMBEDDING_API_URL: ${{ secrets.MEMORY_EVAL_EMBEDDING_API_URL }}
          LITELLM_PROXY_URL: ${{ secrets.MEMORY_EVAL_LITELLM_PROXY_URL }}
          LITELLM_URL: ${{ secrets.MEMORY_EVAL_LITELLM_URL }}
          MEMORY_EVAL_REQUIRE_FAILURE_MODE_COVERAGE: 'true'
          MEMORY_EVAL_REQUIRE_FIXTURE_CHANGELOG: 'true'
          MEMORY_EVAL_FAILURE_MODE_MIN_ROWS: ${{ vars.MEMORY_EVAL_FAILURE_MODE_MIN_ROWS }}
        run: |
          set -euo pipefail

          if [ "${{ steps.prep.outputs.split }}" = "held-out" ]; then
            export MEMORY_EVAL_ALLOW_HELD_OUT=true
          else
            export MEMORY_EVAL_ALLOW_FULL_SET=true
          fi

          report_path="$RUNNER_TEMP/memory-eval-${{ steps.prep.outputs.split }}.txt"

          set +e
          pnpm memory:eval \
            --no-mock \
            --split "${{ steps.prep.outputs.split }}" \
            --fixture "$PRIVATE_FIXTURE_PATH" \
            --fixture-changelog "$PRIVATE_FIXTURE_CHANGELOG_PATH" 2>&1 | tee "$report_path"
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            echo "::error title=Memory eval failed::See the step summary and uploaded memory-eval artifact for the captured report."
          fi

          exit "$status"

      - name: Append eval summary
        if: always() && steps.prep.outputs.should_run == 'true'
        run: |
          {
            echo "## Memory Eval (${{ steps.prep.outputs.split }})"
            echo
            if [ -f "$RUNNER_TEMP/memory-eval-${{ steps.prep.outputs.split }}.txt" ]; then
              echo '```text'
              cat "$RUNNER_TEMP/memory-eval-${{ steps.prep.outputs.split }}.txt"
              echo '```'
            else
              echo "No eval report file was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval artifact
        if: always() && steps.prep.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: memory-eval-${{ steps.prep.outputs.split }}-${{ github.sha }}
          path: |
            ${{ env.PRIVATE_FIXTURE_CHANGELOG_PATH }}
            ${{ runner.temp }}/memory-eval-${{ steps.prep.outputs.split }}.txt
          if-no-files-found: ignore
